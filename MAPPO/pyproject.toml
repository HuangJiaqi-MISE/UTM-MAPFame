[project]
name = "utm-mappo"
version = "0.1.0"
description = "UTM-specific CTDE/MAPPO training environment for emergency distributed path planning."
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "pettingzoo>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
train = [
    "torch>=2.2",
    "tqdm>=4.66",
]
viz = [
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["utm_mappo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
